<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accordion</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
  </head>
  <body>
    <div class="main">
      <div class="desc">
        <h1>Frequently Asked Questions</h1>
        <p>Here are some of the frequently asked questions</p>
      </div>
      <div>
        <div class="question">
          <button class="faq" role="tab">
            <h3>What is roadmap.sh?</h3>
            <img
              src="../assets/icons/chevron-down.svg"
              alt="chevron-down"
              width="20"
              height="20"
            />
          </button>
          <div class="ans">
            <p>
              roadmap.sh is a community effort to create learning paths, guides,
              project ideas and other similar content to help developers grow in
              their careers.
            </p>
          </div>
        </div>
        <div class="question">
          <button class="faq" role="tab">
            <h3>What are the plans for roadmap.sh?</h3>
            <img
              src="../assets/icons/chevron-down.svg"
              alt="chevron-down"
              width="20"
              height="20"
            />
          </button>
          <div class="ans"></div>
        </div>
        <div class="question">
          <button class="faq" role="tab">
            <h3>How is roadmap.sh built?</h3>
            <img
              id=""
              src="../assets/icons/chevron-down.svg"
              alt="chevron-down"
              width="20"
              height="20"
            />
          </button>
          <div class="ans"></div>
        </div>
        <div class="question">
          <button class="faq" role="tab">
            <h3>Can I use roadmap.sh in my team</h3>
            <img
              id=""
              src="../assets/icons/chevron-down.svg"
              alt="chevron-down"
              width="20"
              height="20"
            />
          </button>
          <div class="ans"></div>
        </div>
        <div class="question">
          <button class="faq" role="tab">
            <h3>How can I create custom roadmaps?</h3>
            <img
              id=""
              src="../assets/icons/chevron-down.svg"
              alt="chevron-down"
              width="20"
              height="20"
            />
          </button>
          <div class="ans"></div>
        </div>
        <div class="question">
          <button class="faq" role="tab">
            <h3>Is roadmap.sh really 7th most starred project on Github?</h3>
            <img
              id=""
              src="../assets/icons/chevron-down.svg"
              alt="chevron-down"
              width="20"
              height="20"
            />
          </button>
          <div class="ans"></div>
        </div>
      </div>
    </div>
  </body>
</html>
