<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accessible Form UI</title>
  </head>
  <link rel="stylesheet" href="style.css" />

  <body>
    <main>
      <form action="">
        <div class="details">
          <div class="form-group">
            <label for="full">Full Name</label>
            <input
              id="full"
              type="text"
              placeholder="What should we call you?"
            />
          </div>
          <div class="form-group">
            <label for="eamil">Email</label>
            <input id="email" type="email" placeholder="sample@doe.com" />
          </div>

          <div class="form-group">
            <label for="password">Enter Password</label>
            <div class="passgroup">
              <input
                id="password"
                type="password"
                aria-required="true"
                placeholder="xxxxxxxx"
                aria-required="true"
                aria-invalid="false"
                required
              />
              <img
                src="../assets/icons/eye-alt.svg"
                alt="eye-con"
                class="img"
                onclick="showpass('password', this)"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="cpassword">Confirm Password</label>
            <div class="passgroup">
              <input
                id="cpassword"
                type="password"
                aria-required="true"
                placeholder="xxxxxxxx"
                aria-required="true"
                aria-invalid="false"
                required
              />
              <img
                src="../assets/icons/eye-alt.svg"
                alt="eye-con"
                class="img"
                onclick="showpass('cpassword', this)"
              />
            </div>
          </div>

          <button>Update Profile</button>
        </div>

        <div class="completion">
          <div class="progress">
            <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
              <text x="50" y="62" text-anchor="middle" font-size="24">65%</text>
              <circle
                cx="50"
                cy="55"
                r="40"
                fill="none"
                stroke="gray"
                stroke-width="1"
              />
              <circle
                cx="50"
                cy="55"
                r="40"
                fill="none"
                stroke="black"
                stroke-width="3"
                stroke-dashoffset="-25"
                pathlength="100"
                stroke-dasharray="65"
                stroke-linecap="round"
              />
            </svg>
            <h4 style="font-weight: 500">Profile Completeness</h4>
          </div>
          <div class="tasks">
            <p>Create Account</p>
            <p>Update Roadmap Progress</p>
            <p>Setup Public Profile</p>
            <p>Complete your first project</p>
            <p>Invite your friends</p>
          </div>
        </div>
      </form>
    </main>
  </body>
  <script>
    function showpass(p, icon) {
      var x = document.getElementById(p);
      icon.classList.toggle("active");
      x.type =
        x.type === "password" ? (x.type = "text") : (x.type = "password");
    }
  </script>
</html>
