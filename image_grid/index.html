<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Grid</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="layout">
        <img
          src="../assets/images/foggy beach.jpg"
          alt="A foggy beach with a large rock formation in the foreground"
        /><img
          src="../assets/images/table topped.jpg"
          alt="A table topped with plates and bowls"
        /><img
          src="../assets/images/white buildings.jpg"
          alt="A row of white apartment buildings next to a street"
        /><img
          src="../assets/images/living room.jpg"
          alt="A living room with a white couch and a round window"
        />
        <img
          src="../assets/images/red door.jpg"
          alt="A building with a red door and a tree in front of it"
        /><img
          src="../assets/images/beach.jpg"
          alt="A view of a beach from the top of a hill"
        />
      </div>
    </main>
  </body>
</html>
