<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cookie Consent</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div>
      <div id="main">
        <h1>Hello World!</h1>
        <button id="reset" onclick="resetCookies()">Reset Cookies!</button>
      </div>

      <div id="pop-up">
        <h2>Privacy Cookies</h2>
        <p>
          We value your privacy and use your cookies to improve your user
          experience
        </p>
        <div class="btns">
          <button id="allow">Allow Cookies</button>
          <button>Decline</button>
        </div>
      </div>
    </div>
  </body>
</html>
